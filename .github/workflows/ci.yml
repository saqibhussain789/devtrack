name: DevTrack CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: devtrack
          POSTGRES_PASSWORD: devtrack
          POSTGRES_DB: devtrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devtrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://devtrack:devtrack@localhost:5432/devtrack_test
      JWT_ACCESS_SECRET: ci_access_secret_not_for_production_use
      JWT_REFRESH_SECRET: ci_refresh_secret_not_for_production_use
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api

      - name: Apply database migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - run: npm run lint
      - run: npm run check-types
      - run: npm test
      - run: npm run build

      - name: Dependency audit
        # Fails only on high/critical — two moderate advisories are known and
        # accepted (a dev-only Prisma CLI transitive dependency and a
        # Next.js-internal build-time postcss copy, neither reachable from a
        # deployed request; see README) so they shouldn't make CI flaky, but a
        # new high/critical advisory — like the Next.js CVEs fixed in this
        # phase — should actually block the build.
        run: npm audit --audit-level=high
